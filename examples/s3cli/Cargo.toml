[package]
name = "s3cli"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[features]
default = []
# ALPN ネゴシエーションで h2 に合意できたら shiguredo_http2 を使う
h2 = ["dep:shiguredo_http2"]

[dependencies]
shiguredo_s3 = { path = "../..", default-features = false, features = ["aws_lc_rs"] }
shiguredo_http11 = "2026.1.0"
shiguredo_http2 = { version = "2026.1.0-canary.2", optional = true }
rustls = { version = "0.23", default-features = false, features = [
    "std",
    "tls12",
    "aws_lc_rs",
] }
tokio = { version = "1", features = ["net", "io-util", "io-std", "rt-multi-thread", "sync", "fs"] }
tokio-rustls = { version = "0.26", default-features = false }
rustls-platform-verifier = "0.6"
noargs = "0.3"
