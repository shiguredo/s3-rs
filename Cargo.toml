[package]
name = "shiguredo_s3"
version = "2026.1.0-canary.3"
edition = "2024"
rust-version = "1.88"
description = "Sans I/O Amazon S3 client library for Rust"
readme = "README.md"
homepage = "https://github.com/shiguredo/s3-rs"
repository = "https://github.com/shiguredo/s3-rs"
license = "Apache-2.0"
include = ["/LICENSE", "/README.md", "/src/**"]

[workspace]
members = ["examples/s3cli"]
exclude = ["fuzz"]

[dependencies]
# 署名計算とチェックサム計算 (feature で切り替え)
# - 署名: SHA-256, HMAC-SHA256
# - チェックサム: SHA-256, SHA-1
aws-lc-rs = { version = "1.16", optional = true }
base64ct = { version = "1.8", features = ["alloc"] }
# チェックサム計算 (CRC32, CRC32C, CRC64NVME)
# 1.10 は MSRV 1.89 を要求するため、本体の rust-version 1.88 を維持するために 1.9.x に固定する
crc-fast = "~1.9"
hmac = { version = "0.13", optional = true }
# Content-MD5 / SSE-C key MD5 計算
md-5 = "0.11"
sha1 = { version = "0.11", optional = true }
sha2 = { version = "0.11", optional = true }
# XML パース
xml = "1.2"

[dev-dependencies]
shiguredo_http11 = "2026.2"
testcontainers = { version = "0.27", features = ["http_wait_plain"] }
tokio = { version = "1.52", features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
] }

[features]
# 署名計算 (SHA-256 / HMAC-SHA256) とチェックサム計算 (SHA-256 / SHA-1) の暗号ライブラリを選択する
# - rust-crypto (デフォルト): pure Rust の sha2 / sha1 / hmac クレートを使用する
# - aws_lc_rs: aws-lc-rs を使用する (SHA-256 / HMAC-SHA256 / SHA-1 を全てカバー)
#   rustls で aws-lc-rs を使用する場合は暗号ライブラリを統一するためにこちらを指定すること
default = ["rust-crypto"]
aws_lc_rs = ["dep:aws-lc-rs"]
rust-crypto = ["dep:hmac", "dep:sha1", "dep:sha2"]
